<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <title>letscode profile picture</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Chat bubble ("let's") — kept inside the circular crop -->
  <path filter="url(#shadow)" fill="#FFFFFF"
        d="M360 290 H720 A110 110 0 0 1 830 400 V620 A110 110 0 0 1 720 730
           H420 L320 815 L340 730 A110 110 0 0 1 250 620 V400 A110 110 0 0 1 360 290 Z"/>

  <!-- </> ("code") -->
  <g fill="none" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="445,425 360,510 445,595" stroke="url(#ink)"/>
    <polyline points="635,425 720,510 635,595" stroke="url(#ink)"/>
    <line x1="568" y1="405" x2="512" y2="615" stroke="#EC4899"/>
  </g>
</svg>
